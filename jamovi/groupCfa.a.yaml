---
# GENERATED by tools/gen_yaml.py -- edit that script, not this file.
# Group CFA (Invariance) (groupCfa): OPTIONS. jmvtools compiles this file (with the .r.yaml)
# into R/groupCfa.h.R.
name: groupCfa
title: Group CFA (Invariance)
menuGroup: psyWiz
menuSubgroup: Factor Models
version: '1.0.0'
jas: '1.2'
description:
  main: >
    Tests the measurement invariance of a one-factor or correlated-factors model across groups. Fits the model under increasingly strict equality constraints (configural, [thresholds,] loadings, intercepts and optionally residual variances), compares each step with the previous one and points at the constraints that fit worst.
  R:
    dontrun: true
    usage: |
      data('wizdata', package = 'psyWiz')
      psyWiz::groupCfa(wizdata, group = 'country', run = TRUE, factors = list(
          list(label = 'Trust', vars = c('trust1', 'trust2', 'trust3', 'trust4')),
          list(label = 'Stress', vars = c('stress1', 'stress2', 'stress3', 'stress4'))))
options:
  - name: data
    type: Data
    description:
      R: >
        the data as a data frame
  - name: factors
    title: Factors
    type: Array
    default:
      - label: Factor 1
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - ordinal
            - continuous
          permitted:
            - numeric
            - factor
    description:
      R: >
        a list of lists, each with a `label` (the factor name) and `vars` (the names of its items)
  - name: group
    title: 'Grouping Variable'
    type: Variable
    suggested:
      - nominal
    permitted:
      - factor
    description:
      R: >
        a string naming the grouping variable
  # Nothing is fitted until this is ticked: the models can take a while and
  # jamovi re-runs an analysis every time an option changes.
  - name: run
    title: 'Run analysis'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), fit the models; while `FALSE` only a summary of the plan is shown
  - name: type
    title: 'Treat items as'
    type: List
    options:
      - name: auto
        title: 'Their measure type'
      - name: ordinal
        title: 'Ordinal'
      - name: continuous
        title: 'Continuous'
    default: auto
    description:
      R: >
        `'auto'` (default; ordinal variables are treated as ordinal, continuous ones as continuous), `'ordinal'` or `'continuous'`
  - name: estimator
    title: 'Estimator'
    type: List
    options:
      - name: auto
        title: 'Automatic (MLR / WLSMV)'
      - name: MLR
        title: 'MLR (continuous)'
      - name: ML
        title: 'ML (continuous)'
      - name: MLM
        title: 'MLM (continuous)'
      - name: WLSMV
        title: 'WLSMV (ordinal)'
      - name: ULSMV
        title: 'ULSMV (ordinal)'
      - name: DWLS
        title: 'DWLS (ordinal)'
      - name: ULS
        title: 'ULS (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; MLR for continuous items, WLSMV for ordinal items), `'ML'`, `'MLR'`, `'MLM'`, `'WLSMV'`, `'ULSMV'`, `'DWLS'` or `'ULS'`
  - name: missing
    title: 'Missing values'
    type: List
    options:
      - name: auto
        title: 'Automatic (FIML / pairwise)'
      - name: listwise
        title: 'Exclude cases listwise'
      - name: fiml
        title: 'Full information ML (continuous)'
      - name: pairwise
        title: 'Pairwise (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; FIML for ML and MLR, pairwise deletion for ordinal items), `'listwise'`, `'fiml'` or `'pairwise'`
  - name: strict
    title: 'Also test residual variances (strict)'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), add a step constraining the residual variances to equality
  - name: parallel
    title: 'Use several processor cores for slow models'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, fit the models concurrently when one takes more than a second
  # DECISION CRITERIA: which changes in fit flag a step, and from what size.
  - name: useCfi
    title: 'CFI drops by more than'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, use the change in CFI for the verdict
  - name: cutCfi
    title: ''
    type: Number
    default: 0.01
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.010), the largest acceptable drop in CFI
  - name: useRmsea
    title: 'RMSEA rises by more than'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, use the change in RMSEA for the verdict
  - name: cutRmsea
    title: ''
    type: Number
    default: 0.015
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.015), the largest acceptable rise in RMSEA
  - name: useSrmr
    title: 'SRMR rises by more than'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), use the change in SRMR for the verdict
  - name: cutSrmrLoad
    title: '(loadings step)'
    type: Number
    default: 0.03
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.030), the largest acceptable rise in SRMR at the step that constrains loadings
  - name: cutSrmr
    title: '(other steps)'
    type: Number
    default: 0.01
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.010), the largest acceptable rise in SRMR at the other steps
  - name: useChisq
    title: 'Chi-square difference test has p below'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), use the chi-square difference test for the verdict
  - name: alpha
    title: ''
    type: Number
    default: 0.05
    min: 0.0001
    max: 0.5
    description:
      R: >
        a number (default 0.05), the significance level of the difference test
  # OUTPUT
  - name: culprits
    title: 'Worst-fitting constraints'
    type: List
    options:
      - name: failed
        title: 'For steps that are not supported'
      - name: all
        title: 'For every step'
      - name: none
        title: 'Do not show'
    default: failed
    description:
      R: >
        `'failed'` (default), `'all'` or `'none'`: for which steps to list the score tests of the constraints
  - name: culpritsN
    title: 'Constraints listed per step'
    type: Integer
    default: 5
    min: 1
    max: 200
    description:
      R: >
        an integer (default 5), how many constraints to list for each step
  - name: showLoadings
    title: 'Standardized loadings by group'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), show the standardized loadings of the configural model for each group
  - name: partial
    title: 'Partial invariance: release the worst items when a step fails'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), refit the ladder releasing, item by item, the constraints with the largest score tests at every step that is not supported
  - name: maxFree
    title: 'Items released per factor, at most'
    type: Integer
    default: 2
    min: 1
    max: 20
    description:
      R: >
        an integer (default 2), the largest number of items released per factor at one step
  - name: showComb
    title: 'Comb plot'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the comb plot: one tooth per item, whose length is the variance the item shares with its factor
  - name: combThick
    title: 'Tooth thickness by item variance'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), make each tooth as thick as the item's observed variance is large
  - name: showPath
    title: 'Path diagram'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the path diagram
  - name: pathNumbers
    title: 'Loadings on the arrows'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, print the standardized loadings on the arrows
  - name: pathWidth
    title: 'Arrow width by loading'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, make the width of an arrow proportional to its loading
  - name: highlight
    title: 'Colour'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), show flagged changes in fit in red
  - name: robust
    title: 'Robustness of the verdict'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), refit the ladder under other estimators and item treatments, apply five decision rules to each step and report how often each level of invariance is supported (takes about four times as long)
...
