---
title: psyWiz
name: psyWiz
version: 1.0.0
jms: '1.0'
authors:
  - Herman Elgueta
maintainer: Herman Elgueta <herman.elgueta@umag.cl>
date: '2026-11-26'
type: R
description: >-
  Confirmatory factor analysis (CFA), measurement invariance, bifactor models,
  and exploratory structural equation modeling (ESEM) with native ordinal item
  handling: single-scale diagnostics, plain and second-order CFA with comb
  plots, step-by-step measurement invariance with verdicts, partial invariance
  and latent mean comparisons, bifactor models with antenna plots, CFA vs. ESEM
  with brush plots, and side-by-side multi-estimator comparisons.
analyses:
  - title: Scale Check
    name: scaleCheck
    ns: psyWiz
    menuGroup: psyWiz
    menuTitle: Scale Check
    description: >
      Evaluate a single scale before fitting larger factor models: reliability
      (alpha, lambda-2, omega, AVE), item diagnostics, and a comb plot.
      Optionally tests tau-equivalence and parallelism, plus Guttman / Mokken
      scalability.
    category: analyses
  - title: CFA
    name: plainCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuTitle: CFA
    description: >
      Confirmatory factor analysis of one factor, several correlated factors, or
      a second-order structure: fit indices, standardized loadings, factor
      correlations, reliability (alpha, omega, AVE), and a comb plot. Handles
      ordinal items natively via WLSMV.
    category: analyses
  - title: Measurement Invariance
    name: groupCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuTitle: Measurement Invariance
    description: >
      Tests measurement invariance of a one-factor or correlated-factors CFA
      across groups: configural, [thresholds,] metric, scalar, and optional
      strict models with step-by-step verdicts, score tests for worst-fitting
      constraints, automated partial invariance, multiverse robustness, and
      latent mean comparisons.
    category: analyses
  - title: Bifactor CFA
    name: bifactorCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuTitle: Bifactor CFA
    description: >
      Orthogonal bifactor model: every item loads on a general factor and on one
      specific factor. Reports omega hierarchical, explained common variance
      (ECV), Item ECV, and visual diagnostics (antenna plot and facing combs).
    category: analyses
  - title: CFA vs. ESEM
    name: esemCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuTitle: CFA vs. ESEM
    description: >
      Compares the hypothesised correlated-factors CFA against an exploratory
      structural equation model (ESEM with target or geomin rotation), showing
      factor correlations across scoring methods and a brush plot of
      cross-loadings.
    category: analyses
  - title: Multi-Estimator CFA
    name: multiEstCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuTitle: Multi-Estimator CFA
    description: >
      Fits one confirmatory factor model (one factor or several correlated
      factors) under several estimators and shows fit indices, loadings, factor
      correlations and reliabilities side by side.
    category: analyses
datasets:
  - name: Trust and stress in three countries
    path: wizdata.omv
    description: >-
      Simulated survey: two correlated factors (trust, stress), four 5-point
      items each, three countries, n = 1200. One stress item has a shifted
      intercept in one country.
  - name: A laboratory of instruments
    path: wizlab.omv
    description: >-
      Simulated: several short instruments of different item types (ordinal,
      numeric, binary) and qualities: clean scales, a scale with a dud item, a
      cross-loading, a residual pair and a non-invariant item, a bifactor
      questionnaire, a Guttman scale, and a non-scale. n = 1500, three regions.
usesNative: true
minApp: 2.4.0

...
