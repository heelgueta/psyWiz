---
title: psyWiz
name: psyWiz
version: 0.4.0
jms: '1.0'
authors:
  - Herman Elgueta
maintainer: Herman Elgueta <herman.elgueta@umag.cl>
date: '2026-11-16'
type: R
description: >-
  Confirmatory factor analysis (CFA) and exploratory structural equation
  modeling (ESEM) with ordinal items handled as ordinal: plain CFA with comb
  plots and 2nd-order structures, step-by-step measurement invariance across
  groups (verdicts, score tests, partial invariance, and latent means), bifactor
  models with antenna plots, multi-estimator comparisons side by side, and CFA
  vs ESEM with brush plots.
analyses:
  - title: CFA
    name: plainCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Factor Models
    menuTitle: CFA
    description: >
      Confirmatory factor analysis of one factor or several correlated factors:
      fit, standardized loadings, factor correlations and reliability, with
      ordinal items handled as ordinal. Optionally the largest modification
      indices and the factor correlations obtained from composite scores and
      factor scores.
    category: analyses
  - title: Group CFA (Invariance)
    name: groupCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Factor Models
    menuTitle: Group CFA (Invariance)
    description: >
      Tests the measurement invariance of a one-factor or correlated-factors
      model across groups. Fits the model under increasingly strict equality
      constraints (configural, [thresholds,] loadings, intercepts and optionally
      residual variances), compares each step with the previous one and points
      at the constraints that fit worst.
    category: analyses
  - title: Bifactor CFA
    name: bifactorCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Factor Models
    menuTitle: Bifactor CFA
    description: >
      Bifactor model: every item loads on a general factor and on one specific
      factor, all uncorrelated. Shows how much of the total score and of each
      subscale score is general (omega hierarchical, explained common variance),
      with an antenna plot.
    category: analyses
  - title: Multi-Estimator CFA
    name: multiEstCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Factor Models
    menuTitle: Multi-Estimator CFA
    description: >
      Fits one confirmatory factor model (one factor or several correlated
      factors) under several estimators and shows fit indices, loadings, factor
      correlations and reliabilities side by side.
    category: analyses
  - title: CFA vs ESEM
    name: esemCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Factor Models
    menuTitle: CFA vs ESEM
    description: >
      Fits the hypothesised correlated-factors model as a CFA and as an
      exploratory structural equation model (every item may load on every
      factor), and lists each factor correlation as obtained from composite
      scores, corrected composites, the CFA, factor scores and the ESEM.
    category: analyses
  - title: Composite Check
    name: compositeCheck
    ns: psyWiz
    category: analyses
    menuGroup: psyWiz
    menuSubgroup: Scales
    menuTitle: Composite Check
    description: >
      Checks whether a set of formative indicators relates to two or more
      outcomes through one weighted composite (rank-one reduced-rank
      regression), and how much is lost by using a unit-weighted sum, in sample
      and in cross-validation.
  - title: Item Order (Exploratory)
    name: itemOrder
    ns: psyWiz
    category: analyses
    menuGroup: psyWiz
    menuSubgroup: Scales
    menuTitle: Item Order (Exploratory)
    description: >
      Looks for order among yes/no items without a hypothesis: which items form
      a cumulative line, which are interchangeable, which branch and which stand
      apart. Combines Mokken-type scales, implications between items drawn as a
      Hasse diagram, and the answer patterns.
  - title: Scale Check
    name: scaleCheck
    ns: psyWiz
    category: analyses
    menuGroup: psyWiz
    menuSubgroup: Scales
    menuTitle: Scale Check
    description: >
      Checks one scale: reliability (alpha, lambda-2, omega, AVE) and item
      statistics. On request: whether the items are congeneric, tau-equivalent
      or parallel (which decides whether alpha and unit-weighted sum scores are
      justified), and Guttman / Mokken scalability.
datasets:
  - name: Trust and stress in three countries
    path: wizdata.omv
    description: >-
      Simulated survey: two correlated factors (trust, stress), four 5-point
      items each, three countries, n = 1200. One stress item has a shifted
      intercept in one country.
  - name: A laboratory of instruments
    path: wizlab.omv
    description: >-
      Simulated: several short instruments of different item types (ordinal,
      numeric, binary) and qualities: clean scales, a scale with a dud item, a
      cross-loading, a residual pair and a non-invariant item, a bifactor
      questionnaire, a Guttman scale, a non-scale, and debt sources that form a
      partial order. n = 1500, three regions.
usesNative: true
minApp: 2.4.0

...
