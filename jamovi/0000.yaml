---
title: psyWiz
name: psyWiz
version: 0.3.0
jms: '1.0'
authors:
  - Herman Elgueta
maintainer: Herman Elgueta <herman.elgueta@umag.cl>
date: '2026-11-14'
type: R
description: >-
  Psychometric wizardry for confirmatory factor analysis. Test measurement
  invariance across groups step by step (for continuous and for ordinal items),
  with a verdict for each step and a list of the constraints that fit worst; and
  fit one CFA under several estimators to compare fit, loadings and reliability
  side by side.
analyses:
  - title: Scale Check
    name: scaleCheck
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Single Scale
    menuTitle: Scale Check
    description: >
      Checks one scale: reliability (alpha, lambda-2, omega, AVE), whether the
      items are congeneric, tau-equivalent or parallel (which decides whether
      alpha and unit-weighted sum scores are justified), item statistics, and
      Guttman / Mokken scalability.
    category: analyses
  - title: One-Factor Group CFA
    name: groupCfaOne
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Measurement Invariance
    menuTitle: One-Factor Group CFA
    description: >
      Tests the measurement invariance of a one-factor model across groups. Fits
      the model under increasingly strict equality constraints (configural,
      [thresholds,] loadings, intercepts and optionally residual variances),
      compares each step with the previous one and points at the constraints
      that fit worst.
    category: analyses
  - title: Correlated-Factors Group CFA
    name: groupCfaCorr
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Measurement Invariance
    menuTitle: Correlated-Factors Group CFA
    description: >
      Tests the measurement invariance of a correlated-factors model across
      groups. Fits the model under increasingly strict equality constraints
      (configural, [thresholds,] loadings, intercepts and optionally residual
      variances), compares each step with the previous one and points at the
      constraints that fit worst.
    category: analyses
  - title: Multi-Estimator CFA
    name: multiEstCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Model Comparison
    menuTitle: Multi-Estimator CFA
    description: >
      Fits one confirmatory factor model (one factor or several correlated
      factors) under several estimators and shows fit indices, loadings, factor
      correlations and reliabilities side by side.
    category: analyses
  - title: CFA vs ESEM
    name: esemCfa
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Model Comparison
    menuTitle: CFA vs ESEM
    description: >
      Fits the hypothesised correlated-factors model as a CFA and as an
      exploratory structural equation model (every item may load on every
      factor), and lists each factor correlation as obtained from composite
      scores, corrected composites, the CFA, factor scores and the ESEM.
    category: analyses
  - title: Composite Check
    name: compositeCheck
    ns: psyWiz
    menuGroup: psyWiz
    menuSubgroup: Formative Indicators
    menuTitle: Composite Check
    description: >
      Checks whether a set of formative indicators relates to two or more
      outcomes through one weighted composite (rank-one reduced-rank
      regression), and how much is lost by using a unit-weighted sum, in sample
      and in cross-validation.
    category: analyses
datasets:
  - name: Trust and stress in three countries
    path: wizdata.omv
    description: >-
      Simulated survey: two correlated factors (trust, stress), four 5-point
      items each, three countries, n = 1200. One stress item has a shifted
      intercept in one country.
usesNative: true
minApp: 2.4.0

...
