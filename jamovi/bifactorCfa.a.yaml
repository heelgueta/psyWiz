---
# GENERATED by tools/gen_yaml.py -- edit that script, not this file.
# Bifactor CFA (bifactorCfa): OPTIONS. jmvtools compiles this file (with the .r.yaml)
# into R/bifactorCfa.h.R.
name: bifactorCfa
title: Bifactor CFA
menuGroup: psyWiz
menuSubgroup: Factor Models
version: '1.0.0'
jas: '1.2'
description:
  main: >
    Bifactor model: every item loads on a general factor and on one specific factor, all uncorrelated. Shows how much of the total score and of each subscale score is general (omega hierarchical, explained common variance), with an antenna plot.
  R:
    dontrun: true
    usage: |
      data('wizlab', package = 'psyWiz')
      psyWiz::bifactorCfa(wizlab, run = TRUE, generalName = 'Wellbeing', factors = list(
          list(label = 'Body', vars = paste0('body', 1:4)),
          list(label = 'Mind', vars = paste0('mind', 1:4)),
          list(label = 'Social', vars = paste0('social', 1:4))))
options:
  - name: data
    type: Data
    description:
      R: >
        the data as a data frame
  - name: factors
    title: Specific Factors
    type: Array
    default:
      - label: Factor 1
        vars: []
      - label: Factor 2
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - ordinal
            - continuous
          permitted:
            - numeric
            - factor
    description:
      R: >
        a list of lists, each with a `label` (the factor name) and `vars` (the names of its items)
  - name: generalName
    title: 'Name of the general factor'
    type: String
    default: 'General'
    description:
      R: >
        a string, the name of the general factor
  # Nothing is fitted until this is ticked: the models can take a while and
  # jamovi re-runs an analysis every time an option changes.
  - name: run
    title: 'Run analysis'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), fit the models; while `FALSE` only a summary of the plan is shown
  - name: type
    title: 'Treat items as'
    type: List
    options:
      - name: auto
        title: 'Their measure type'
      - name: ordinal
        title: 'Ordinal'
      - name: continuous
        title: 'Continuous'
    default: auto
    description:
      R: >
        `'auto'` (default; ordinal variables are treated as ordinal, continuous ones as continuous), `'ordinal'` or `'continuous'`
  - name: estimator
    title: 'Estimator'
    type: List
    options:
      - name: auto
        title: 'Automatic (MLR / WLSMV)'
      - name: MLR
        title: 'MLR (continuous)'
      - name: ML
        title: 'ML (continuous)'
      - name: MLM
        title: 'MLM (continuous)'
      - name: WLSMV
        title: 'WLSMV (ordinal)'
      - name: ULSMV
        title: 'ULSMV (ordinal)'
      - name: DWLS
        title: 'DWLS (ordinal)'
      - name: ULS
        title: 'ULS (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; MLR for continuous items, WLSMV for ordinal items), `'ML'`, `'MLR'`, `'MLM'`, `'WLSMV'`, `'ULSMV'`, `'DWLS'` or `'ULS'`
  - name: missing
    title: 'Missing values'
    type: List
    options:
      - name: auto
        title: 'Automatic (FIML / pairwise)'
      - name: listwise
        title: 'Exclude cases listwise'
      - name: fiml
        title: 'Full information ML (continuous)'
      - name: pairwise
        title: 'Pairwise (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; FIML for ML and MLR, pairwise deletion for ordinal items), `'listwise'`, `'fiml'` or `'pairwise'`
  # OUTPUT
  - name: showIndices
    title: 'Omega and explained common variance'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show omega, omega hierarchical and ECV
  - name: showLoadings
    title: 'Loadings'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show the standardized loadings
  - name: showAntenna
    title: 'Antenna plot'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, draw the antenna plot: general factor to the left, specific to the right
  - name: showFacing
    title: 'Facing combs'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the general and the specific combs growing towards each other, with the unique variance of each item in between
  - name: showPath
    title: 'Path diagram'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the path diagram
  - name: pathNumbers
    title: 'Loadings on the arrows'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, print the standardized loadings on the arrows
  - name: pathWidth
    title: 'Arrow width by loading'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, make the width of an arrow proportional to its loading
  - name: plotFit
    title: 'Model fit on plot'
    type: List
    options:
      - name: none
        title: 'Do not show'
      - name: below
        title: 'Below plot'
      - name: above
        title: 'Above plot'
    default: none
    description:
      R: >
        `'none'` (default), `'below'` or `'above'`, print the model fit measures and estimator on the figure
...
