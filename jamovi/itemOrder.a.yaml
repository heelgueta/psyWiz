---
# GENERATED by tools/gen_yaml.py -- edit that script, not this file.
# Item Order (Exploratory) (itemOrder): OPTIONS. jmvtools compiles this file (with the .r.yaml)
# into R/itemOrder.h.R.
name: itemOrder
title: Item Order (Exploratory)
menuGroup: psyWiz
menuSubgroup: Scales
version: '1.0.0'
jas: '1.2'
description:
  main: >
    Looks for order among yes/no items without a hypothesis: which items form a cumulative line, which are interchangeable, which branch and which stand apart. Combines Mokken-type scales, implications between items drawn as a Hasse diagram, and the answer patterns.
  R:
    dontrun: true
    usage: |
      data('wizlab', package = 'psyWiz')
      psyWiz::itemOrder(wizlab, vars = c('debt_family', 'debt_friends', 'debt_bank',
                                         'debt_card', 'debt_lender', 'debt_mortgage'))
options:
  - name: data
    type: Data
    description:
      R: >
        the data as a data frame
  - name: vars
    title: 'Items'
    type: Variables
    suggested:
      - nominal
      - ordinal
    permitted:
      - numeric
      - factor
    description:
      R: >
        a vector of strings naming the items
  - name: tolerance
    title: 'Exceptions tolerated (%)'
    type: Number
    default: 10
    min: 0
    max: 50
    description:
      R: >
        a number (default 10): 'A implies B' is accepted when at most this percentage of those who endorse A do not endorse B
  - name: hMin
    title: 'Smallest H'
    type: Number
    default: 0.3
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.30), the smallest Loevinger H for an implication and for joining a scale
  - name: showHasse
    title: 'Order diagram'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, draw the order as a Hasse diagram
  - name: showImplications
    title: 'Implications'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, list the direct implications
  - name: showScales
    title: 'Cumulative (Mokken) scales'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, list the cumulative scales and the unscalable items
  - name: showPatterns
    title: 'Most frequent answer patterns'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), list the most frequent answer patterns
  - name: patternsN
    title: 'Number listed'
    type: Integer
    default: 10
    min: 1
    max: 200
    description:
      R: >
        an integer (default 10), how many patterns
  - name: highlight
    title: 'Colour'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), show item H below the smallest H in red
...
