---
# GENERATED by tools/gen_yaml.py -- edit that script, not this file.
# CFA vs ESEM (esemCfa): OPTIONS. jmvtools compiles this file (with the .r.yaml)
# into R/esemCfa.h.R.
name: esemCfa
title: CFA vs ESEM
menuGroup: psyWiz
menuSubgroup: Factor Models
version: '1.0.0'
jas: '1.2'
description:
  main: >
    Fits the hypothesised correlated-factors model as a CFA and as an exploratory structural equation model (every item may load on every factor), and lists each factor correlation as obtained from composite scores, corrected composites, the CFA, factor scores and the ESEM.
  R:
    dontrun: true
    usage: |
      data('wizdata', package = 'psyWiz')
      psyWiz::esemCfa(wizdata, run = TRUE, factors = list(
          list(label = 'Trust', vars = c('trust1', 'trust2', 'trust3', 'trust4')),
          list(label = 'Stress', vars = c('stress1', 'stress2', 'stress3', 'stress4'))))
options:
  - name: data
    type: Data
    description:
      R: >
        the data as a data frame
  - name: factors
    title: Factors
    type: Array
    default:
      - label: Factor 1
        vars: []
      - label: Factor 2
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - ordinal
            - continuous
          permitted:
            - numeric
            - factor
    description:
      R: >
        a list of lists, each with a `label` (the factor name) and `vars` (the names of its items)
  # Nothing is fitted until this is ticked: the models can take a while and
  # jamovi re-runs an analysis every time an option changes.
  - name: run
    title: 'Run analysis'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), fit the models; while `FALSE` only a summary of the plan is shown
  - name: type
    title: 'Treat items as'
    type: List
    options:
      - name: auto
        title: 'Their measure type'
      - name: ordinal
        title: 'Ordinal'
      - name: continuous
        title: 'Continuous'
    default: auto
    description:
      R: >
        `'auto'` (default; ordinal variables are treated as ordinal, continuous ones as continuous), `'ordinal'` or `'continuous'`
  - name: estimator
    title: 'Estimator'
    type: List
    options:
      - name: auto
        title: 'Automatic (MLR / WLSMV)'
      - name: MLR
        title: 'MLR (continuous)'
      - name: ML
        title: 'ML (continuous)'
      - name: MLM
        title: 'MLM (continuous)'
      - name: WLSMV
        title: 'WLSMV (ordinal)'
      - name: ULSMV
        title: 'ULSMV (ordinal)'
      - name: DWLS
        title: 'DWLS (ordinal)'
      - name: ULS
        title: 'ULS (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; MLR for continuous items, WLSMV for ordinal items), `'ML'`, `'MLR'`, `'MLM'`, `'WLSMV'`, `'ULSMV'`, `'DWLS'` or `'ULS'`
  - name: missing
    title: 'Missing values'
    type: List
    options:
      - name: auto
        title: 'Automatic (FIML / pairwise)'
      - name: listwise
        title: 'Exclude cases listwise'
      - name: fiml
        title: 'Full information ML (continuous)'
      - name: pairwise
        title: 'Pairwise (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; FIML for ML and MLR, pairwise deletion for ordinal items), `'listwise'`, `'fiml'` or `'pairwise'`
  - name: rotation
    title: 'ESEM rotation'
    type: List
    options:
      - name: target
        title: 'Target (towards the hypothesised pattern)'
      - name: geomin
        title: 'Geomin'
    default: target
    description:
      R: >
        `'target'` (default; cross-loadings are rotated towards zero) or `'geomin'`
  - name: parallel
    title: 'Use several processor cores for slow models'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, fit the models concurrently when one takes more than a second
  # OUTPUT
  - name: showLoadings
    title: 'Loadings and cross-loadings'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show the standardized loadings of both models
  - name: showCors
    title: 'Factor correlations by method'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show each factor correlation under the different scoring methods
  - name: highlight
    title: 'Colour'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), show cross-loadings of 0.30 or more and own-factor loadings below 0.40 in red
  - name: showBrush
    title: 'Brush plot'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the ESEM loadings of every item on every factor
...
