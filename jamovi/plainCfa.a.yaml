---
# GENERATED by tools/gen_yaml.py -- edit that script, not this file.
# CFA (plainCfa): OPTIONS. jmvtools compiles this file (with the .r.yaml)
# into R/plainCfa.h.R.
name: plainCfa
title: CFA
menuGroup: psyWiz
menuSubgroup: Factor Models
version: '1.0.0'
jas: '1.2'
description:
  main: >
    Confirmatory factor analysis of one factor or several correlated factors: fit, standardized loadings, factor correlations and reliability, with ordinal items handled as ordinal. Optionally the largest modification indices and the factor correlations obtained from composite scores and factor scores.
  R:
    dontrun: true
    usage: |
      data('wizdata', package = 'psyWiz')
      # resCov has no default when called from R: pass list() for none
      psyWiz::plainCfa(wizdata, run = TRUE, resCov = list(), factors = list(
          list(label = 'Trust', vars = c('trust1', 'trust2', 'trust3', 'trust4')),
          list(label = 'Stress', vars = c('stress1', 'stress2', 'stress3', 'stress4'))))
options:
  - name: data
    type: Data
    description:
      R: >
        the data as a data frame
  - name: factors
    title: Factors
    type: Array
    default:
      - label: Factor 1
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested:
            - ordinal
            - continuous
          permitted:
            - numeric
            - factor
    description:
      R: >
        a list of lists, each with a `label` (the factor name) and `vars` (the names of its items)
  # Nothing is fitted until this is ticked: the models can take a while and
  # jamovi re-runs an analysis every time an option changes.
  - name: run
    title: 'Run analysis'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), fit the models; while `FALSE` only a summary of the plan is shown
  - name: type
    title: 'Treat items as'
    type: List
    options:
      - name: auto
        title: 'Their measure type'
      - name: ordinal
        title: 'Ordinal'
      - name: continuous
        title: 'Continuous'
    default: auto
    description:
      R: >
        `'auto'` (default; ordinal variables are treated as ordinal, continuous ones as continuous), `'ordinal'` or `'continuous'`
  - name: estimator
    title: 'Estimator'
    type: List
    options:
      - name: auto
        title: 'Automatic (MLR / WLSMV)'
      - name: MLR
        title: 'MLR (continuous)'
      - name: ML
        title: 'ML (continuous)'
      - name: MLM
        title: 'MLM (continuous)'
      - name: WLSMV
        title: 'WLSMV (ordinal)'
      - name: ULSMV
        title: 'ULSMV (ordinal)'
      - name: DWLS
        title: 'DWLS (ordinal)'
      - name: ULS
        title: 'ULS (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; MLR for continuous items, WLSMV for ordinal items), `'ML'`, `'MLR'`, `'MLM'`, `'WLSMV'`, `'ULSMV'`, `'DWLS'` or `'ULS'`
  - name: missing
    title: 'Missing values'
    type: List
    options:
      - name: auto
        title: 'Automatic (FIML / pairwise)'
      - name: listwise
        title: 'Exclude cases listwise'
      - name: fiml
        title: 'Full information ML (continuous)'
      - name: pairwise
        title: 'Pairwise (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; FIML for ML and MLR, pairwise deletion for ordinal items), `'listwise'`, `'fiml'` or `'pairwise'`
  # ADDITIONS TO THE MODEL
  - name: resCov
    title: Residual correlations
    type: Pairs
    permitted:
      - numeric
      - factor
    description:
      R: >
        a list of lists, each with `i1` and `i2`: pairs of items whose residuals may correlate
  - name: secondOrder
    title: 'Second-order factor instead of factor correlations'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), let the factors (three or more) load on one second-order factor
  - name: higherName
    title: 'Its name'
    type: String
    default: 'General'
    description:
      R: >
        a string, the name of the second-order factor
  # OUTPUT
  - name: showLoadings
    title: 'Loadings'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show the loadings
  - name: showRel
    title: 'Reliability'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show alpha, omega and AVE per factor
  - name: showCors
    title: 'Factor correlations'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show the correlations between the factors
  - name: showComb
    title: 'Comb plot'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, draw the comb plot: one tooth per item, whose length is the variance the item shares with its factor
  - name: combThick
    title: 'Tooth thickness by item variance'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), make each tooth as thick as the item's observed variance is large
  - name: showPath
    title: 'Path diagram'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the path diagram
  - name: pathNumbers
    title: 'Loadings on the arrows'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, print the standardized loadings on the arrows
  - name: pathWidth
    title: 'Arrow width by loading'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, make the width of an arrow proportional to its loading
  - name: plotFit
    title: 'Model fit on plot'
    type: List
    options:
      - name: none
        title: 'Do not show'
      - name: below
        title: 'Below plot'
      - name: above
        title: 'Above plot'
    default: none
    description:
      R: >
        `'none'` (default), `'below'` or `'above'`, print the model fit measures and estimator on the figure
  - name: highlight
    title: 'Colour'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), mark standardized loadings below 0.40 in the table and add a summary of fit indices, loadings and reliabilities on a colour ramp
  - name: palette
    title: 'Palette'
    type: List
    options:
      - name: purpleorange
        title: 'Orange to purple (colour-blind safe)'
      - name: cividis
        title: 'Yellow to blue (colour-blind safe)'
      - name: redblue
        title: 'Red to blue (classic psyWiz)'
      - name: grey
        title: 'Greys'
    default: purpleorange
    description:
      R: >
        the colour ramp used when colour is on: `'purpleorange'` (default), `'cividis'`, `'redblue'` or `'grey'`
  - name: showMethods
    title: 'Factor correlations by scoring method'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), show each factor correlation as obtained from composite scores, corrected composites, the CFA and factor scores
  - name: showMi
    title: 'Largest modification indices'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), list the residual correlations and cross-loadings with the largest modification indices
  - name: miN
    title: 'Number listed'
    type: Integer
    default: 10
    min: 1
    max: 200
    description:
      R: >
        an integer (default 10), how many to list
...
