# Multi-Estimator CFA (multiEstCfa): OPTIONS PANEL. compilerMode `tame`:
# jmvtools keeps this layout and only appends controls for options that are
# missing from it.
title: Multi-Estimator CFA
name: multiEstCfa
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: ListBox
            name: factors
            height: large
            addButton: Add New Factor
            templateName: linreg-block-template
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  valueKey:
                    - label
                  borderless: true
                  name: blockName
                  stretchFactor: 1
                  margin: normal
                - type: VariablesListBox
                  valueFilter: unique
                  valueKey:
                    - vars
                  name: blockList
                  isTarget: true
                  height: auto
                  ghostText: drag items here
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: run
  - type: CollapseBox
    label: Estimators
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Maximum likelihood
                children:
                  - type: CheckBox
                    name: estML
                  - type: CheckBox
                    name: estMLR
                  - type: CheckBox
                    name: estMLM
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Least squares
                children:
                  - type: CheckBox
                    name: estULS
                  - type: CheckBox
                    name: estULSMV
                  - type: CheckBox
                    name: estDWLS
                  - type: CheckBox
                    name: estWLSMV
                  - type: CheckBox
                    name: estWLS
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: type
          - type: ComboBox
            name: missing
          - type: CheckBox
            name: parallel
  - type: CollapseBox
    label: Output
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showStd
          - type: CheckBox
            name: showUnstd
          - type: CheckBox
            name: sortLoadings
          - type: CheckBox
            name: showCors
          - type: CheckBox
            name: showRel
          - type: CheckBox
            name: highlight
