---
# GENERATED by tools/gen_yaml.py -- edit that script, not this file.
# Scale Check (scaleCheck): OPTIONS. jmvtools compiles this file (with the .r.yaml)
# into R/scaleCheck.h.R.
name: scaleCheck
title: Scale Check
menuGroup: psyWiz
version: '1.0.0'
jas: '1.2'
description:
  main: >
    Evaluate a single scale before fitting larger factor models: reliability (alpha, lambda-2, omega, AVE), item diagnostics, and a comb plot. Optionally tests tau-equivalence and parallelism, plus Guttman / Mokken scalability.
  R:
    dontrun: true
    usage: |
      data('wizdata', package = 'psyWiz')
      psyWiz::scaleCheck(wizdata, vars = c('trust1', 'trust2', 'trust3', 'trust4'), run = TRUE)
options:
  - name: data
    type: Data
    description:
      R: >
        the data as a data frame
  - name: vars
    title: 'Items'
    type: Variables
    suggested:
      - ordinal
      - continuous
    permitted:
      - numeric
      - factor
    description:
      R: >
        a vector of strings naming the items of the scale
  - name: scaleName
    title: 'Scale name'
    type: String
    default: 'Scale'
    description:
      R: >
        a string, the name of the scale
  # Nothing is fitted until this is ticked: the models can take a while and
  # jamovi re-runs an analysis every time an option changes.
  - name: run
    title: 'Run analysis'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), fit the models; while `FALSE` only a summary of the plan is shown
  - name: type
    title: 'Treat items as'
    type: List
    options:
      - name: auto
        title: 'Their measure type'
      - name: ordinal
        title: 'Ordinal'
      - name: continuous
        title: 'Continuous'
    default: auto
    description:
      R: >
        `'auto'` (default; ordinal variables are treated as ordinal, continuous ones as continuous), `'ordinal'` or `'continuous'`
  - name: estimator
    title: 'Estimator'
    type: List
    options:
      - name: auto
        title: 'Automatic (MLR / WLSMV)'
      - name: MLR
        title: 'MLR (continuous)'
      - name: ML
        title: 'ML (continuous)'
      - name: MLM
        title: 'MLM (continuous)'
      - name: WLSMV
        title: 'WLSMV (ordinal)'
      - name: ULSMV
        title: 'ULSMV (ordinal)'
      - name: DWLS
        title: 'DWLS (ordinal)'
      - name: ULS
        title: 'ULS (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; MLR for continuous items, WLSMV for ordinal items), `'ML'`, `'MLR'`, `'MLM'`, `'WLSMV'`, `'ULSMV'`, `'DWLS'` or `'ULS'`
  - name: missing
    title: 'Missing values'
    type: List
    options:
      - name: auto
        title: 'Automatic (FIML / pairwise)'
      - name: listwise
        title: 'Exclude cases listwise'
      - name: fiml
        title: 'Full information ML (continuous)'
      - name: pairwise
        title: 'Pairwise (ordinal)'
    default: auto
    description:
      R: >
        `'auto'` (default; FIML for ML and MLR, pairwise deletion for ordinal items), `'listwise'`, `'fiml'` or `'pairwise'`
  - name: parallel
    title: 'Use multiple CPU cores for slow models'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, fit the models concurrently when one takes more than a second
  # INVARIANCE CUTOFFS: which changes in fit flag a step, and from what size.
  - name: useCfi
    title: 'CFI drops by more than'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, use the change in CFI for the verdict
  - name: cutCfi
    title: ''
    type: Number
    default: 0.01
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.010), the largest acceptable drop in CFI
  - name: useRmsea
    title: 'RMSEA rises by more than'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, use the change in RMSEA for the verdict
  - name: cutRmsea
    title: ''
    type: Number
    default: 0.015
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.015), the largest acceptable rise in RMSEA
  - name: useSrmr
    title: 'SRMR rises by more than'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), use the change in SRMR for the verdict
  - name: cutSrmrLoad
    title: '(loadings step)'
    type: Number
    default: 0.03
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.030), the largest acceptable rise in SRMR at the step that constrains loadings
  - name: cutSrmr
    title: '(other steps)'
    type: Number
    default: 0.01
    min: 0
    max: 1
    description:
      R: >
        a number (default 0.010), the largest acceptable rise in SRMR at the other steps
  - name: useChisq
    title: 'Chi-square difference test has p below'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), use the chi-square difference test for the verdict
  - name: alpha
    title: ''
    type: Number
    default: 0.05
    min: 0.0001
    max: 0.5
    description:
      R: >
        a number (default 0.05), the significance level of the difference test
  # OUTPUT
  - name: showItems
    title: 'Item diagnostics'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show the item table
  - name: tau
    title: 'Test tau-equivalence and parallelism'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), compare the congeneric, tau-equivalent and parallel models
  - name: showScal
    title: 'Scalability indices (Guttman & Mokken)'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), show Loevinger's H and Guttman scalogram statistics
  - name: showComb
    title: 'Comb plot'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, draw the comb plot: one tooth per item, whose length is the variance the item shares with its factor
  - name: combThick
    title: 'Tooth thickness by item variance'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), make each tooth as thick as the item's observed variance is large
  - name: showPath
    title: 'Path diagram'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw the path diagram
  - name: pathNumbers
    title: 'Loadings on arrows'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, print the standardized loadings on the arrows
  - name: pathWidth
    title: 'Arrow width by loading'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, make the width of an arrow proportional to its loading
  - name: plotFit
    title: 'Model fit on plot'
    type: List
    options:
      - name: none
        title: 'Do not show'
      - name: below
        title: 'Below plot'
      - name: above
        title: 'Above plot'
    default: none
    description:
      R: >
        `'none'` (default), `'below'` or `'above'`, print the model fit measures and estimator on the figure
  - name: showPlotGuide
    title: 'Show plot guide'
    type: Bool
    default: true
    description:
      R: >
        `TRUE` (default) or `FALSE`, show a short reading guide above each novel plot
  - name: highlight
    title: 'Flag weak / misfitting values'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), highlight poor fit, flagged steps, weak loadings (below 0.40), alpha-if-dropped gains, and low H (below 0.30) in red
  - name: guttmanOrder
    title: 'Guttman item order'
    type: List
    options:
      - name: entered
        title: 'As entered (easiest first)'
      - name: difficulty
        title: 'Sorted by endorsement'
    default: entered
    description:
      R: >
        `'entered'` (default: the order of `vars` is taken as the hypothesised order, easiest item first) or `'difficulty'` (items sorted from the most to the least endorsed)
  - name: showScalogram
    title: 'Scalogram plot'
    type: Bool
    default: false
    description:
      R: >
        `TRUE` or `FALSE` (default), draw respondents sorted by total score against the items
...
